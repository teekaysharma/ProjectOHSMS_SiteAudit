name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      # Dev-time findings stay visible but do not block. Open: braces
      # (GHSA-vfj7-8cjw-p6xm) via vite-plugin-singlefile, no patched release.
      - name: Audit (full, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
